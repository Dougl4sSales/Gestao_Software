
services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: meu-projeto-backend
    working_dir: /app
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=MeuProjetoDb;User Id=sa;Password=${SA_PASSWORD};Encrypt=True;TrustServerCertificate=True;"
    volumes:
      - ./Backend:/app
      - nuget_packages:/root/.nuget/packages
    depends_on:
      sqlserver:
        condition: service_healthy
    command: dotnet watch run --project src/MeuProjeto.API/MeuProjeto.API.csproj --urls http://+:8080

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: meu-projeto-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        - CMD
        - /opt/mssql-tools18/bin/sqlcmd
        - -S
        - localhost
        - -U
        - sa
        - -P
        - ${SA_PASSWORD}
        - -C
        - -Q
        - SELECT 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  sqlserver_data:
  nuget_packages:
